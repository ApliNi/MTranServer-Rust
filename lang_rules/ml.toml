[metadata]
language = "ml"
version = "1.0.0"
word_boundary = true

[generation]
token_density_ratio = 1.25
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
quote_style = "curly"

[syntax]
clustering_gap_threshold = 4
head_direction = "head_final"

[discourse]
discourse_starters = [
    # വ്യക്തിനാമ സർവ്വനാമങ്ങളും നിർദ്ദേശകങ്ങളും
    "അവൻ", "അവൾ", "അവർ", "അത്", "അവ",
    "അവന്റെ", "അവളുടെ", "അവരുടെ", "അതിന്റെ", "അവയ്ക്ക്", "അവന്", "അവൾക്ക്", "അവർക്ക്",
    "ഇവൻ", "ഇവൾ", "ഇവർ", "ഇത്", "ഇവ",
    "ഇവന്റെ", "ഇവളുടെ", "ഇവരുടെ", "ഇതിന്റെ", "ഇവയ്ക്ക്", "ഇവന്", "ഇവൾക്ക്", "ഇവർക്ക്",
    # സംഭാഷണ സംയോജകങ്ങളും ക്രിയാവിശേഷണങ്ങളും
    "അതിനാൽ", "ആകയാൽ", "എന്നിരുന്നാലും", "എങ്കിലും", "ഫലമായി",
    "വാസ്തവത്തിൽ", "കൂടാതെ", "മാത്രമല്ല", "അവസാനമായി", "ചുരുക്കത്തിൽ",
    "അപ്രകാരം", "അതേസമയം", "നേരെമറിച്ച്", "പ്രത്യേകിച്ച്", "എന്നാൽ പോലും",
]

[conjunctions]
clause_conjunctions = [
    # ഏകോപന അവ്യയങ്ങൾ
    "എന്നാൽ", "പക്ഷേ", "അല്ലെങ്കിൽ", "അതുകൊണ്ട്",
    # കാരണവും ഫലവും വ്യക്തമാക്കുന്ന അവ്യയങ്ങൾ
    "എന്തെന്നാൽ", "കാരണം", "എങ്കിലും", "എന്നിട്ടും", "ആകയാൽ",
    # വ്യവസ്ഥ, സമയം, രീതി സംയോജകങ്ങൾ
    "എങ്കിൽ", "എപ്പോൾ", "അപ്പോൾ", "എങ്ങനെ", "അങ്ങനെ",
    "എവിടെ", "അവിടെ", "അതുപോലെ",
    # ഉദ്ധരണി, വിവരണാത്മക സംയോജകങ്ങൾ
    "എന്ന്", "എന്ന് വെച്ചാൽ",
]

[abbreviations]
nonbreaking_prefixes = [
    # ആദരസൂചക പദവികളും പ്രൊഫഷണൽ സംക്ഷിപ്തങ്ങളും
    "ഡോ.", "പ്രൊഫ.", "ശ്രീ", "ശ്രീമതി", "കുമാരി.", "സ്വാമി.",
    "ഫാ.", "റവ.", "അഡ്വ.", "എൻജി.", "ജസ്റ്റിസ്.", "ക്യാപ്റ്റൻ.",
    # പരാമർശ, ഗ്രന്ഥസൂചിക, പൊതു സംക്ഷിപ്തരൂപങ്ങൾ
    "ഉദാ.", "പേ.", "പേജ്.", "വോള്യം.", "നം.", "നമ്പർ.", "തീയതി.",
    "ലിമിറ്റഡ്.", "ലി.", "കോ.", "വി.വി.", "മു.പോ.", "വി.സൂ.",
]
conditional_end_prefixes = [
    "തുടങ്ങിയവ.", "മുതലായവ.", "ഉദാ.", "പേ.", "നം.", "ലിമിറ്റഡ്.",
]
