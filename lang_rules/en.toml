[metadata]
language = "en"
version = "1.1.0"
word_boundary = true

[generation]
token_density_ratio = 1.0
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
pangu_spacing = false
quote_style = "curly"


[syntax]
clustering_gap_threshold = 3
head_direction = "head_initial"

[hyphenation]
prefixes = [
    "e", "a", "x", "pre", "post", "re", "co", "non", "sub", "anti", "self", "real", "cross",
    "multi", "auto", "semi", "inter", "intra", "well", "high", "low", "full", "half", "open",
    "built", "end", "out", "in", "on", "off", "up", "all", "ill", "over", "under", "micro",
    "macro", "neo", "pseudo", "ultra", "cyber", "bio", "ex", "mid", "quasi",
]
suffixes = [
    "like", "free", "proof", "based", "driven", "related", "bound", "oriented", "friendly",
    "ready", "rich", "wide", "wise", "able", "only", "time", "up", "in", "off", "out", "down",
    "known",
]
connectors = [
    "to", "of", "the", "by", "and", "in", "for", "a",
]

[detection]
greetings = [
    "good afternoon", "good evening", "good morning", "good night", "hello",
    "see you later", "thank you", "thanks",
]

[discourse]
discourse_starters = [
    # Third-person anaphoric pronouns (subject, object, possessive, reflexive)
    "he", "her", "hers", "herself", "him", "himself", "his", "it",
    "its", "itself", "she", "their", "theirs", "them", "themselves",
    "they",
    # Demonstratives and indefinite anaphora
    "here", "one", "oneself", "such", "that", "the former", "the latter",
    "there", "these", "this", "those",
    # Logical, causal, and sequential connectives
    "accordingly", "additionally", "also", "and", "besides", "but",
    "consequently", "furthermore", "hence", "however", "in addition",
    "in contrast", "indeed", "in fact", "instead", "likewise", "meanwhile",
    "moreover", "nevertheless", "nonetheless", "on the contrary",
    "on the other hand", "otherwise", "overall", "similarly", "so",
    "subsequently", "then", "therefore", "thus", "yet",
]

[conjunctions]
clause_conjunctions = [
    # Coordinating conjunctions
    "and", "but", "for", "nor", "or", "so", "yet",
    # Subordinating conjunctions - causal and result
    "as", "because", "inasmuch as", "in order that", "insofar as", "lest",
    "since", "so that",
    # Subordinating conjunctions - concessive and adversative
    "although", "even if", "even though", "much as", "rather than", "though",
    "whereas", "while",
    # Subordinating conjunctions - conditional
    "as long as", "if", "in case", "on condition that", "provided that",
    "providing that", "so long as", "unless", "whether",
    # Subordinating conjunctions - temporal
    "after", "as soon as", "before", "once", "till", "until", "when",
    "whenever",
    # Relative pronouns and locatives
    "that", "where", "wherever", "which", "who", "whom", "whose",
]

[abbreviations]
nonbreaking_prefixes = [
    # Honorifics and titles
    "Adm.", "Atty.", "Capt.", "Cmdr.", "Col.", "Dr.", "Esq.", "Fr.",
    "Gen.", "Gov.", "Hon.", "Insp.", "Jr.", "Lt.", "Maj.", "Messrs.",
    "Miss.", "Mr.", "Mrs.", "Ms.", "Mt.", "Pres.", "Prof.", "Rep.",
    "Rev.", "Sec.", "Sen.", "Sgt.", "Sr.", "St.", "Supt.", "Treas.",
    # Academic, citations, and scholarly publications
    "acad.", "approx.", "c.", "ca.", "cf.", "ch.", "chap.", "cl.",
    "coll.", "dept.", "diss.", "div.", "ed.", "edn.", "eds.", "eq.",
    "eqs.", "est.", "et al.", "etc.", "e.g.", "fig.", "figs.", "ibid.",
    "id.", "i.e.", "inst.", "loc. cit.", "no.", "nos.", "op. cit.", "p.",
    "para.", "pp.", "proc.", "ref.", "refs.", "rev.", "sc.", "sec.",
    "subpara.", "suppl.", "tab.", "trans.", "univ.", "v.", "viz.", "vol.",
    "vols.", "vs.",
    # Business, corporate, and institutional entities
    "Assoc.", "Bros.", "Co.", "Corp.", "Inc.", "LLC.", "LLP.", "Ltd.",
    "Mfg.", "PLC.",
    # Units of measurement, dates, and time
    "avg.", "dia.", "ft.", "gal.", "ht.", "in.", "lb.", "lbs.", "max.",
    "mi.", "min.", "mph.", "oz.", "pt.", "qt.", "rpm.", "temp.",
    "wt.", "yd.",
    "A.D.", "B.C.", "B.C.E.", "C.E.", "a.m.", "p.m.",
    "Jan.", "Feb.", "Mar.", "Apr.", "Jun.", "Jul.", "Aug.", "Sep.",
    "Sept.", "Oct.", "Nov.", "Dec.",
    "Mon.", "Tue.", "Wed.", "Thu.", "Fri.", "Sat.", "Sun.",
    # Address, location, and administrative divisions
    "Apt.", "Ave.", "Bldg.", "Blvd.", "Ct.", "Hwy.", "Ln.",
    "Pl.", "Rd.", "Rm.", "Sq.", "Ste.",
]
conditional_end_prefixes = [
    "etc.", "al.", "inc.", "ltd.", "co.", "corp.", "vs.",
]
