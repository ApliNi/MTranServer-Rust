[metadata]
language = "zh-hant"
version = "1.0.0"
word_boundary = false

[generation]
token_density_ratio = 0.65
repetition_penalty = 1.15
no_repeat_ngram_size = 5

[typography]
pangu_spacing = false
quote_style = "corner"


[syntax]
clustering_gap_threshold = 3
head_direction = "head_initial"

[discourse]
discourse_starters = [
    # 指示代詞與第三人稱代詞照應
    "它", "牠", "祂", "它們", "牠們", "他", "他們", "她", "她們",
    "這", "這個", "這些", "這裡", "這兒", "這種", "這樣", "這般",
    "那", "那個", "那些", "那裡", "那兒", "那種", "那樣", "那般",
    "此", "此外", "此時", "此處", "此後", "此前", "此種", "此項", "此舉",
    "其", "其中", "其實", "其次", "其他", "其餘", "其後",
    "該", "該項", "该類", "該案", "該生",
    "雙方", "對方",
    # 篇章邏輯與連接詞照應
    "因此", "因而", "所以", "由此", "由此可見", "從而", "故此", "故而",
    "但是", "然而", "不過", "可是", "但",
    "同時", "並且", "而且", "另外", "反之", "相反", "與此同時",
    "總之", "綜上所述", "換言之", "具體而言", "顯而易見", "實際上", "事實上",
]

[conjunctions]
clause_conjunctions = [
    # 條件與假設連詞
    "如果", "要是", "假如", "假使", "倘若", "倘使", "若是", "假若",
    "萬一", "只要", "只有", "除非", "若非",
    # 因果與推論連詞
    "因為", "由於", "既然", "之所以", "因此", "因而", "所以", "故而",
    "以致", "以至於", "以至", "從而", "進而", "繼而", "致使", "由是",
    "鑑於",
    # 轉折與讓步連詞
    "但是", "然而", "不過", "可是", "儘管", "雖然", "固然", "即使",
    "哪怕", "縱使", "即便", "雖說", "雖則", "反而", "反倒", "反之",
    "相反",
    # 並列與遞進連詞
    "而且", "並且", "以及", "同時", "此外", "另外", "不僅", "不但",
    "不單", "非但", "甚至", "更何況", "況且", "加之",
    # 選擇與目的連詞
    "或者", "抑或", "與其", "寧可", "以免", "免得", "省得", "以求",
    "以便",
]

[abbreviations]
nonbreaking_prefixes = [
    "No.", "no.", "vs.", "v.", "etc.", "e.g.", "i.e.", "et al.",
    "Dr.", "Prof.", "Mr.", "Mrs.", "Ms.", "Sr.", "Jr.",
    "Fig.", "Figs.", "Vol.", "Vols.", "p.", "pp.", "Sec.", "Ref.", "Eq.",
    "approx.", "dept.", "est.", "min.", "max.",
    "Co.", "Corp.", "Inc.", "Ltd.",
]
conditional_end_prefixes = [
    "等.", "例.", "如.",
]

[detection]
distinctive_chars = ['亂', '佩', '佬', '來', '俠', '倆', '倉', '個', '們', '倫', '偉', '側', '偵', '備', '傭', '傯', '傳', '債', '傷', '傾', '僂', '僅', '僑', '僨', '價', '儀', '儂', '億', '儉', '儐', '儔', '儕', '償', '優', '儲', '儷', '儺', '儻', '儼', '兒', '內', '兩', '冊', '凈', '凌', '凍', '凜', '凱', '別', '創', '劃', '劉', '動', '區', '員', '問', '單', '嚴', '囅', '國', '圖', '報', '夥', '學', '實', '寫', '專', '對', '導', '岡', '師', '帶', '幾', '廣', '後', '從', '應', '數', '時', '書', '會', '東', '條', '業', '樂', '標', '樣', '機', '權', '歡', '歷', '氣', '決', '況', '涼', '淒', '減', '湊', '準', '濟', '灣', '為', '無', '爭', '爲', '獸', '現', '產', '當', '發', '眾', '確', '禮', '結', '絡', '給', '經', '網', '總', '繫', '義', '習', '聯', '聲', '聽', '臺', '與', '興', '舉', '茲', '萬', '著', '蘭', '處', '虧', '術', '衝', '見', '規', '視', '親', '覺', '觀', '計', '訊', '設', '評', '話', '認', '說', '請', '論', '謝', '證', '變', '讓', '買', '賣', '質', '車', '軍', '辦', '農', '這', '進', '運', '過', '選', '還', '邊', '錢', '長', '門', '開', '間', '關', '際', '隨', '雙', '難', '電', '響', '頭', '題', '類', '風', '飛', '養', '餘', '馬', '馮', '驗', '體', '鳧', '鳳', '麗', '麼', '點', '黨']
