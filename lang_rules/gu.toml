    "તે", "તેઓ", "તેણે", "તેમણે", "તેણી", "તેને", "તેમને", "તેમનું", "તેમનો", "તેમની",
    "એ", "આ", "આણે", "આમને", "આનું", "આનો", "આની", "આવા", "આવી", "આવું",
    "પેલા", "પેલી", "પેલું", "પેલો", "તેવા", "તેવી", "તેવું",
    # પરિચ્છેદ સંયોજકો અને ક્રિયાવિશેષણો
    "તેથી", "આથી", "પરિણામે", "છતાં", "જોકે", "વાસ્તવમાં", "ખરેખર", "વધુમાં",
