[metadata]
language = "es"
version = "1.1.0"
word_boundary = true

[generation]
token_density_ratio = 1.15
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
spanish_inverted = true
quote_style = "curly"
inverted_compounds = [
    "por qué", "por que", "para qué", "para que", "por dónde", "por donde", "para dónde", "para donde",
    "por quién", "por quien", "por quiénes", "por quienes", "para quién", "para quien", "para quiénes", "para quienes",
    "para cuándo", "para cuando", "de qué", "de que", "de dónde", "de donde", "de quién", "de quien",
    "de quiénes", "de quienes", "de cuál", "de cual", "de cuáles", "de cuales", "de cuánto", "de cuanto",
    "desde dónde", "desde donde", "desde cuándo", "desde cuando", "a qué", "a que", "a dónde", "a donde",
    "a quién", "a quien", "a quiénes", "a quienes", "a cuál", "a cual", "a cuáles", "a cuales",
    "a cuánto", "a cuanto", "a cuántos", "a cuantos", "a cuántas", "a cuantas", "hacia dónde", "hacia donde",
    "hasta dónde", "hasta donde", "hasta cuándo", "hasta cuando", "en qué", "en que", "en dónde", "en donde",
    "con qué", "con que", "con quién", "con quien", "con quiénes", "con quienes", "con cuál", "con cual",
    "con cuáles", "con cuales", "con cuánto", "con cuanto",
]
interrogatives = [
    "qué", "que", "cómo", "como", "cuándo", "cuando", "dónde", "donde",
    "quién", "quien", "quiénes", "quienes", "cuál", "cual", "cuáles", "cuales",
    "por qué", "porque", "adónde", "adonde", "cuánto", "cuanto",
    "cuánta", "cuanta", "cuántos", "cuantos", "cuántas", "cuantas", "acaso",
]
exclamatories = [
    "qué", "que", "cómo", "como", "cuánto", "cuanto",
    "cuánta", "cuanta", "cuántos", "cuantos", "vaya", "ojalá", "dios", "cielos",
]
introductory_words = [
    "hola", "oye", "mira", "por favor", "favor", "dime", "dinos",
    "disculpa", "perdona", "bueno", "pero", "y", "entonces",
]


[syntax]
clustering_gap_threshold = 3
head_direction = "head_initial"
predicate_verbs = [
    "es", "son", "era", "eran", "fue", "fueron", "tiene", "tienen", "está", "están", "hay",
]

[discourse]
discourse_starters = [
    # Pronombres anafóricos y variantes acentuadas
    "él", "Él", "ella", "Ella", "ellas", "Ellas", "ello", "Ello",
    "ellos", "Ellos", "le", "les",
    # Demostrativos y variantes
    "aquel", "Aquel", "aquella", "Aquella", "aquello", "Aquello",
    "esa", "Esa", "esas", "Esas", "ese", "Ese", "eso", "Eso",
    "esos", "Esos", "esta", "Esta", "estas", "Estas", "este", "Este",
    "esto", "Esto", "estos", "Estos",
    # Conectores discursivos y variantes
    "además", "Además", "así", "Así", "asimismo", "Asimismo", "así pues",
    "de este modo", "en cambio", "en consecuencia", "en efecto",
    "entonces", "finalmente", "no obstante", "por consiguiente",
    "por ende", "por el contrario", "por lo que", "por lo tanto",
    "sin embargo",
]

[conjunctions]
clause_conjunctions = [
    # Conjunciones coordinantes
    "e", "mas", "ni", "o", "pero", "sino", "sino que", "u", "y",
    # Conjunciones subordinantes - causales y consecutivas
    "así que", "como quiera que", "dado que", "de manera que",
    "de modo que", "porque", "puesto que", "pues", "ya que",
    # Conjunciones subordinantes - concesivas y condicionales
    "a menos que", "a no ser que", "a pesar de que", "aunque",
    "aun cuando", "con tal de que", "por más que", "si", "si bien",
    "siempre que",
    # Conjunciones subordinantes - temporales
    "antes de que", "apenas", "cuando", "desde que", "después de que",
    "en cuanto", "hasta que", "luego que", "mientras", "mientras que",
    "tan pronto como",
    # Conjunciones subordinantes - finales y relativas
    "a fin de que", "cuya", "cuyo", "donde", "para que", "que", "quien",
    "quienes",
]

[abbreviations]
nonbreaking_prefixes = [
    # Titles and honorifics
    "Arq.", "Cap.", "Cnel.", "D.", "Dña.", "Dr.", "Dra.", "Gral.",
    "Gob.", "Ing.", "Lic.", "Prof.", "Profa.", "Sr.", "Sra.", "Srta.",
    "Sta.", "Sto.", "Tte.", "Ud.", "Uds.", "Vd.", "Vds.",
    # Academic, citations, and textual references
    "apdo.", "art.", "arts.", "cap.", "caps.", "cf.", "cfr.", "ed.",
    "ej.", "et al.", "etc.", "fasc.", "fig.", "figs.", "ibid.", "nro.",
    "núm.", "no.", "p.", "pág.", "págs.", "pp.", "p. ej.", "sec.",
    "v.", "vol.", "vols.", "vs.",
    # Business, measurement, and geographic abbreviations
    "aprox.", "av.", "avda.", "Cía.", "cl.", "fte.", "máx.", "mín.",
    "pl.", "S.A.", "S.L.",
]
conditional_end_prefixes = [
    "p. ej.", "etc.", "c. c.", "apdo.", "dña.", "sr.",
]

[detection]
distinctive_chars = ['ñ', 'Ñ', '¡', '¿']

[postprocess]
preserve_title_prefix = true
replacements = [
    ["Frambuesa Pi Ltd", "Raspberry Pi Ltd"],
    ["Frambuesa Pi", "Raspberry Pi"],
    ["frambuesa pi", "Raspberry Pi"],
]
