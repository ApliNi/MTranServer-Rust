[metadata]
language = "ko"
version = "1.0.0"
word_boundary = true

[generation]
token_density_ratio = 1.40
repetition_penalty = 1.06
no_repeat_ngram_size = 5

[typography]
pangu_spacing = false

[syntax]
clustering_gap_threshold = 4
head_direction = "head_final"

[discourse]
discourse_starters = [
    # 지시대명사 및 인칭대명사 (조사 결합형 포함)
    "이것은", "이것이", "이것을", "이것의", "이것",
    "그것은", "그것이", "그것을", "그것의", "그것",
    "저것은", "저것이", "저것을", "저것의", "저것",
    "이는", "이가", "이를", "이의",
    "그는", "그가", "그를", "그의", "그에게",
    "그녀는", "그녀가", "그녀를", "그녀의", "그녀에게",
    "그들은", "그들이", "그들을", "그들의", "그들에게",
    "이들은", "이들이", "이들을", "이들의", "이들에게",
    "이러한", "그러한", "저러한",
    "이때", "그때", "이곳", "그곳", "여기", "거기",
    # 담화 표지어 및 문두 접속어
    "그러나", "하지만", "그리고", "그래서", "따라서", "그러므로",
    "또한", "게다가", "결과적으로", "한편", "결론적으로", "사실상",
    "요컨대", "이와 같이", "이처럼",
]

[conjunctions]
clause_conjunctions = [
    # 역접 및 양보 접속사
    "그러나", "하지만", "그렇지만", "그런데", "반면에", "그럼에도 불구하고",
    "그럼에도", "비록", "불구하고", "오히려",
    # 순접 및 인과 접속사
    "그리고", "그래서", "따라서", "그러므로", "그러니까", "그리하여",
    "결과적으로", "왜냐하면", "인하여", "말미암아",
    # 첨가 및 나열 접속사
    "또한", "게다가", "뿐만 아니라", "더불어", "아울러", "나아가",
    "더욱이", "동시에",
    # 조건 및 가설 접속사
    "만약", "만일", "가령", "설령", "혹시", "만약에",
    # 선택 및 전환 접속사
    "또는", "혹은", "그렇지 않으면", "아니면", "한편", "즉", "다시 말해",
]

[abbreviations]
nonbreaking_prefixes = [
    # International Latin abbreviations occurring in Korean technical texts
    "No.", "no.", "vs.", "v.", "etc.", "e.g.", "i.e.", "et al.",
    "Dr.", "Prof.", "Mr.", "Mrs.", "Ms.",
    "Fig.", "fig.", "Figs.", "figs.", "Vol.", "vol.", "Vols.", "vols.",
    "pp.", "p.", "Sec.", "sec.", "Ref.", "ref.", "Eq.", "eq.",
    "co.", "corp.", "inc.", "ltd.", "dept.", "ca.", "approx.",
]
conditional_end_prefixes = [
    "등.", "etc.",
]
