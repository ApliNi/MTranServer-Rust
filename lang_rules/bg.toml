[metadata]
language = "bg"
version = "1.0.0"
word_boundary = true

[generation]
token_density_ratio = 1.25
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
quote_style = "guillemets"

[syntax]
clustering_gap_threshold = 3
head_direction = "head_initial"

[discourse]
discourse_starters = [
    # Third-person anaphoric pronouns and clitics
    "той", "Той", "тя", "Тя", "то", "То", "те", "Те",
    "него", "Него", "нея", "Нея", "тях", "Тях",
    "му", "Му", "ѝ", "ѝ", "им", "Им",
    # Demonstratives
    "това", "Това", "този", "Този", "тази", "Тази", "тези", "Тези",
    "тоя", "Тоя", "тая", "Тая", "туй", "Туй", "онова", "Онова",
    "онзи", "Онзи", "онази", "Онази", "онези", "Онези",
    "такъв", "Такъв", "такава", "Такава", "такова", "Такова", "такива", "Такива",
    "тук", "Тук", "там", "Там",
    # Discourse connectives and transitions
    "освен това", "Освен това", "нещо повече", "Нещо повече", "всъщност", "Всъщност",
    "обаче", "Обаче", "все пак", "Все пак", "въпреки това", "Въпреки това",
    "следователно", "Следователно", "така", "Така", "по този начин", "По този начин",
    "накрая", "Накрая", "в крайна сметка", "В крайна сметка",
    "между другото", "Между другото", "например", "Например",
    "затова", "Затова", "съответно", "Съответно", "от една страна", "От една страна",
    "от друга страна", "От друга страна", "по-специално", "По-специално",
    "първо", "Първо", "второ", "Второ", "наистина", "Наистина",
]

[conjunctions]
clause_conjunctions = [
    # Coordinating conjunctions
    "и", "а", "но", "ала", "обаче", "пък", "или", "дали", "нито",
    # Subordinating conjunctions - causal, consecutive, and final
    "защото", "понеже", "тъй като", "като", "че", "та", "така че", "за да",
    # Subordinating conjunctions - concessive and conditional
    "макар че", "макар и да", "въпреки че", "ако", "дано", "щом", "стига да",
    # Subordinating conjunctions - temporal
    "когато", "докато", "преди да", "след като", "откакто", "щом като",
    # Comparative and modal
    "сякаш", "като че ли",
    # Relative pronouns and locatives
    "който", "която", "което", "които", "какъвто", "чийто", "където", "накъдето",
    "откъдето", "как", "защо", "кога",
]

[abbreviations]
nonbreaking_prefixes = [
    # Titles and honorifics
    "акад.", "арх.", "г-жа.", "г-н.", "г-ца.", "ген.", "д-р.", "доц.",
    "инж.", "кап.", "майор.", "полк.", "проф.", "св.",
    # Scholarly, textual, and editorial
    "ал.", "бел.", "вж.", "вкл.", "изд.", "изкл.", "напр.", "прев.", "ред.",
    "сп.", "срв.", "стр.", "сх.", "т.", "табл.", "фиг.", "чл.",
    # Administrative, geographical, and address
    "ап.", "бл.", "бул.", "вх.", "гр.", "ж.к.", "обл.", "общ.", "пл.",
    "р-н.", "с.", "ул.",
    # Time, metrics, currency, and quantities
    "в.", "вв.", "г.", "гг.", "лв.", "мин.", "млн.", "млрд.", "н. е.",
    "пр. н. е.", "сек.", "ст.", "хил.", "ч.",
    # International Latin abbreviations
    "Dr.", "Fig.", "Prof.", "e.g.", "et al.", "etc.", "i.e.", "vs.",
]
conditional_end_prefixes = [
    "и т.н.", "и др.", "и под.", "т.е.", "лв.", "ст.", "г.", "пр. н. е.",
    "н. е.", "etc.",
]

[detection]
distinctive_chars = ['ъ', 'Ъ']
exclude_chars = ['ы', 'э', 'ё', 'Ї', 'Є', 'Ў']
substring_terms = ["България", "български", "съвет", "Всички", "граждани", "обслужване", "днес"]
