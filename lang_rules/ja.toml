[metadata]
language = "ja"
version = "1.1.0"
word_boundary = false

[generation]
token_density_ratio = 1.75
repetition_penalty = 1.06
no_repeat_ngram_size = 5

[typography]
pangu_spacing = false
quote_style = "corner"

[syntax]
clustering_gap_threshold = 4
head_direction = "head_final"

[discourse]
discourse_starters = [
    # 指示代名詞（こそあど系列）
    "これ", "これら", "この", "ここ", "こちら", "こうして", "このような",
    "それ", "それら", "その", "そこ", "そちら", "そうして", "そのような",
    "あれ", "あれら", "あの", "あそこ", "あちら",
    # 人称代名詞照応
    "彼", "彼は", "彼が", "彼の", "彼を", "彼ら", "彼らは", "彼らが", "彼らの",
    "彼女", "彼女は", "彼女が", "彼女の", "彼女を", "彼女ら", "彼女らは", "彼女らが",
    # 篇章接続・照応開始語
    "また", "そして", "しかし", "だが", "さらに", "そのため", "それゆえ",
    "それから", "それに対して", "したがって", "なぜなら", "つまり", "一方で",
    "他方で", "このように", "実際", "要するに",
]

[conjunctions]
clause_conjunctions = [
    # 逆接・譲歩連詞
    "しかし", "しかしながら", "だが", "けれども", "けれど", "だけど",
    "ただし", "もっとも", "ところが", "それなのに", "にもかかわらず",
    "とはいえ", "といっても",
    # 順接・因果連詞
    "そのため", "したがって", "ゆえに", "それゆえに", "それゆえ",
    "だから", "ですから", "なぜなら", "なぜならば", "というのは",
    "結果として", "その結果",
    # 並立・累加連詞
    "そして", "また", "それに", "それから", "ならびに", "および",
    "かつ", "さらに", "くわえて", "その上",
    # 説明・選択・転換連詞
    "つまり", "要するに", "すなわち", "あるいは", "または", "もしくは",
    "なお", "ちなみに", "ところで", "さて",
    # 条件・仮定連詞
    "もし", "もしも", "仮に", "万一",
]

[abbreviations]
nonbreaking_prefixes = [
    # Academic, technical, and general Latin abbreviations in Japanese contexts
    "No.", "no.", "vs.", "v.", "etc.", "e.g.", "i.e.", "et al.",
    "Dr.", "Prof.", "Mr.", "Mrs.", "Ms.",
    "Fig.", "fig.", "Figs.", "figs.", "Vol.", "vol.", "Vols.", "vols.",
    "pp.", "p.", "Sec.", "sec.", "Ref.", "ref.", "Eq.", "eq.",
    "co.", "corp.", "inc.", "ltd.", "dept.", "cf.", "approx.",
]
conditional_end_prefixes = [
    "等.", "etc.",
]

[detection]
unique_chars = ['込', '枠', '畑', '峠', '働', '辻', '渋', '笹', '塀', '栃', '鯑', '雫', '颪', '発', '専', '駅', '図', '転', '伝', '铁', '気', '庁', '県', '様', '広', '桜']
substring_terms = ["新幹線", "案内", "開催", "株式会社", "東京都", "大学院", "運行管理", "日本国憲法", "憲法前文", "届出書", "記載事項", "連合会", "速報", "警戒", "自由席", "特急券", "発売機", "交通管制", "手続完了", "確認書面", "農業協同組合"]
