[metadata]
language = "uk"
version = "1.0.0"
word_boundary = true

[generation]
token_density_ratio = 1.25
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
quote_style = "guillemets"

[syntax]
clustering_gap_threshold = 3
head_direction = "head_initial"

[discourse]
discourse_starters = [
    # Third-person anaphoric pronouns and oblique forms
    "він", "Він", "вона", "Вона", "воно", "Воно", "вони", "Вони",
    "його", "Його", "нього", "Нього", "її", "Її", "неї", "Неї",
    "їх", "Їх", "них", "Них", "йому", "Йому", "їй", "Їй", "їм", "Їм",
    "ним", "Ним", "нею", "Нею", "ними", "Ними",
    # Demonstratives
    "це", "Це", "цей", "Цей", "ця", "Ця", "ці", "Ці", "цього", "Цього", "цим", "Цим",
    "то", "То", "той", "Той", "та", "Та", "те", "Те", "ті", "Ті", "того", "Того", "тим", "Тим",
    "такий", "Такий", "така", "Така", "таке", "Таке", "такі", "Такі",
    "тут", "Тут", "там", "Там",
    # Discourse connectives and transitions
    "крім того", "Крім того", "більше того", "Більше того", "проте", "Проте",
    "однак", "Однак", "втім", "Втім", "тим не менш", "Тим не менш",
    "отже", "Отже", "таким чином", "Таким чином", "нарешті", "Нарешті",
    "зрештою", "Зрештою", "дійсно", "Дійсно", "насправді", "Насправді",
    "зокрема", "Зокрема", "наприклад", "Наприклад", "водночас", "Водночас",
    "тому", "Тому", "разом з тим", "Разом з тим", "по-перше", "По-перше",
    "по-друге", "По-друге", "з іншого боку", "З іншого боку", "власне", "Власне",
]

[conjunctions]
clause_conjunctions = [
    # Coordinating conjunctions
    "і", "й", "та", "а", "але", "проте", "однак", "зате", "або", "чи",
    # Subordinating conjunctions - causal, consecutive, and final
    "бо", "тому що", "через те що", "завдяки тому що", "оскільки", "позаяк",
    "так що", "що", "щоб", "аби", "для того щоб",
    # Subordinating conjunctions - concessive and conditional
    "хоч", "хоча", "дарма що", "незважаючи на те що",
    "якщо", "якби", "коли б", "коли", "як",
    # Subordinating conjunctions - temporal
    "поки", "доки", "як тільки", "ледве", "перед тим як", "після того як", "відтоді як",
    # Comparative and modal
    "мов", "немов", "наче", "неначе", "ніби", "нібито",
    # Relative pronouns and locatives
    "який", "яка", "яке", "які", "котрий", "хто", "де", "куди", "звідки",
]

[abbreviations]
nonbreaking_prefixes = [
    # Titles and honorifics
    "акад.", "ген.", "д-р.", "доц.", "канд.", "кап.", "лейт.", "майор.",
    "пан.", "пані.", "полк.", "проф.", "св.",
    # Scholarly, textual, and editorial
    "арк.", "вид.", "вип.", "вкл.", "гл.", "див.", "екз.", "і т. д.",
    "і т. ін.", "і т. п.", "іл.", "ім.", "ін.", "інш.", "напр.", "пор.",
    "ред.", "рис.", "розд.", "стор.", "табл.", "том.", "тт.", "ч.",
    # Administrative, geographical, and address
    "бул.", "буд.", "вул.", "кв.", "кімн.", "м.", "обл.", "пл.", "пров.",
    "просп.", "р-н.", "с.", "сел.", "смт.",
    # Time, metrics, currency, and quantities
    "г.", "год.", "грн.", "до н. е.", "коп.", "млн.", "млрд.", "н. е.",
    "р.", "рр.", "сек.", "ст.", "тис.", "хв.",
    # International Latin abbreviations
    "Dr.", "Fig.", "Prof.", "e.g.", "et al.", "etc.", "i.e.", "vs.",
]
conditional_end_prefixes = [
    "і т. д.", "і т. ін.", "і т. п.", "та ін.", "та інш.", "грн.", "коп.",
    "рр.", "р.", "н. е.", "до н. е.", "etc.",
]

[detection]
unique_chars = ['ї', 'є', 'ґ', 'Ї', 'Є', 'Ґ']
distinctive_chars = ['і', 'І']
exclude_chars = ['ы', 'э', 'ё', 'Ы', 'Э', 'Ё']
substring_terms = ["Україна", "україн", "справи", "Міністерство"]
