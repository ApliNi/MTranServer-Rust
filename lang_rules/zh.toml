[metadata]
language = "zh"
version = "1.1.0"
word_boundary = false

[generation]
token_density_ratio = 0.65
repetition_penalty = 1.15
no_repeat_ngram_size = 5

[typography]
pangu_spacing = true
quote_style = "curly"


[syntax]
clustering_gap_threshold = 3
head_direction = "head_initial"
[discourse]
discourse_starters = [
    # 指示代词与第三人称代词照应
    "它", "它们", "他", "他们", "她", "她们",
    "这", "这个", "这些", "这里", "这儿", "这种", "这样", "这般",
    "那", "那个", "那些", "那里", "那儿", "那种", "那样", "那般",
    "此", "此外", "此时", "此处", "此后", "此前", "此种", "此项", "此举",
    "其", "其中", "其实", "其次", "其他", "其余", "其后",
    "该", "该项", "该类", "该案", "该生",
    "双方", "对方",
    # 篇章逻辑与连接词照应
    "因此", "因而", "所以", "由此", "由此可见", "从而", "故此", "故而",
    "但是", "然而", "不过", "可是", "但",
    "同时", "并且", "而且", "另外", "反之", "相反", "与此同时",
    "总之", "综上所述", "换言之", "具体而言", "显而易见", "实际上", "事实上",
]

[conjunctions]
clause_conjunctions = [
    # 条件与假设连词
    "如果", "要是", "假如", "假使", "倘若", "倘使", "若是", "假若",
    "万一", "只要", "只有", "除非", "若非",
    # 因果与推论连词
    "因为", "由于", "既然", "之所以", "因此", "因而", "所以", "故而",
    "以致", "以至于", "以至", "从而", "进而", "继而", "致使", "由是",
    "鉴于",
    # 转折与让步连词
    "但是", "然而", "不过", "可是", "尽管", "虽然", "固然", "即使",
    "哪怕", "纵使", "即便", "虽说", "虽则", "反而", "反倒", "反之",
    "相反",
    # 并列与递进连词
    "而且", "并且", "以及", "同时", "此外", "另外", "不仅", "不但",
    "不单", "非但", "甚至", "更何况", "况且", "加之",
    # 选择与目的连词
    "或者", "还是", "抑或", "要么", "与其", "否则", "不然", "以便",
    "免得", "以免", "以防", "省得", "以求",
]

[abbreviations]
nonbreaking_prefixes = [
    # Frequently occurring international abbreviations in Chinese texts
    "No.", "no.", "vs.", "v.", "etc.", "e.g.", "i.e.", "et al.",
    "Dr.", "Prof.", "Mr.", "Mrs.", "Ms.", "Sr.", "Jr.",
    "Fig.", "fig.", "Figs.", "figs.", "Vol.", "vol.", "Vols.", "vols.",
    "pp.", "p.", "Sec.", "sec.", "Ref.", "ref.", "Eq.", "eq.",
    "cf.", "approx.", "dept.", "inc.", "ltd.", "co.", "corp.",
]
conditional_end_prefixes = [
    "等.", "例.",
]

[detection]
