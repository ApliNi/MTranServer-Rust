[metadata]
language = "vi"
version = "1.0.0"
word_boundary = true

[generation]
token_density_ratio = 1.30
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
quote_style = "curly"

[syntax]
clustering_gap_threshold = 3
head_direction = "head_initial"

[discourse]
discourse_starters = [
    # Third-person anaphoric pronouns and social titles
    "anh ấy", "cô ấy", "ông ấy", "bà ấy", "nó", "họ", "chúng nó", "chúng", "chúng tôi",
    # Demonstratives and spatial anaphora
    "này", "đó", "kia", "đây", "đấy",
    "điều này", "việc này", "những điều này", "những người này",
    # Logical, causal, and discourse connectives
    "ngoài ra", "hơn nữa", "thêm vào đó", "bên cạnh đó", "mặt khác", "trái lại",
    "tuy nhiên", "mặc dù vậy", "dẫu vậy", "thế nhưng", "nhưng mà",
    "do đó", "vì vậy", "cho nên", "kết quả là", "chính vì thế",
    "thực tế là", "trên thực tế", "nói cách khác", "tóm lại", "tổng kết lại",
]

[conjunctions]
clause_conjunctions = [
    # Coordinating conjunctions
    "và", "hoặc", "hay", "nhưng", "song", "mà", "cũng như",
    # Subordinating conjunctions - causal and purpose
    "vì", "bởi vì", "do", "tại", "nhờ", "cho nên", "thành ra",
    "để", "để cho", "cốt để", "nhằm",
    # Subordinating conjunctions - concessive and conditional
    "nếu", "hễ", "giá như", "miễn là", "trừ phi",
    "dù", "mặc dù", "dẫu cho", "cho dù", "tuy rằng",
    # Subordinating conjunctions - temporal
    "khi", "lúc", "trong khi", "sau khi", "trước khi", "ngay khi", "từ khi", "cho đến khi",
    # Relative pronouns and locatives
    "mà", "nơi mà", "người mà",
]

[abbreviations]
nonbreaking_prefixes = [
    # Academic and professional titles
    "TS.", "ThS.", "PGS.", "GS.", "BS.", "DS.", "KTS.", "CN.", "LS.",
    # Geography, administrative units, and addresses
    "Tp.", "TP.", "TX.", "TT.", "Q.", "H.", "P.", "X.", "Đ.",
    # Citations, publishing, and units
    "Tr.", "T.", "NXB.", "Số.", "km.", "m.", "cm.", "kg.",
    # International Latin abbreviations in technical contexts
    "Dr.", "Prof.", "Mr.", "Mrs.", "Ms.", "etc.", "vs.", "al.",
    "vol.", "no.", "p.", "pp.",
]
conditional_end_prefixes = [
    "v.v.", "v.v...", "vv.", "etc.", "al.",
]

[detection]
unique_chars = ['ơ', 'ư', 'đ', 'ả', 'ạ', 'ả', 'ạ', 'ắ', 'ằ', 'ẳ', 'ẵ', 'ặ', 'ấ', 'ầ', 'ẩ', 'ẫ', 'ậ', 'ẻ', 'ẽ', 'ẹ', 'ế', 'ề', 'ể', 'ễ', 'ệ', 'ỉ', 'ị', 'ỏ', 'ọ', 'ố', 'ồ', 'ổ', 'ỗ', 'ộ', 'ớ', 'ờ', 'ở', 'ỡ', 'ợ', 'ủ', 'ụ', 'ứ', 'ừ', 'ử', 'ữ', 'ự', 'ỳ', 'ỷ', 'ỹ', 'ỵ', 'Ơ', 'Ư', 'Đ']
