[metadata]
language = "bn"
version = "1.0.0"
word_boundary = true

[generation]
token_density_ratio = 1.20
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
quote_style = "curly"

[syntax]
clustering_gap_threshold = 4
head_direction = "head_final"

[discourse]
discourse_starters = [
    # সর্বনাম (ব্যক্তিবাচক ও নির্দেশক)
    "তিনি", "তাঁর", "তাঁকে", "তাঁরা", "তাঁদের",
    "সে", "তার", "তাকে", "তারা", "তাদের",
    "ইনি", "এঁর", "এঁকে", "এঁরা", "এঁদের",
    "এ", "এর", "একে", "এরা", "এদের",
    "উনি", "ওঁর", "ওঁকে", "ওঁরা", "ওঁদের",
    "ও", "ওর", "ওকে", "ওরা", "ওদের",
    # নির্দেশক পদ ও বিশেষণ
    "এটি", "এই", "এটা", "এইটা", "এগুলো", "এইগুলো",
    "ওটি", "ওই", "ওটা", "ওইটা", "ওগুলো", "ওইগুলো",
    "সেটি", "সেই", "সেটা", "সেইটা", "সেগুলো", "সেইগুলো",
    # প্রারম্ভিক যোজক ও রূপান্তরমূলক সংযোজক
    "সুতরাং", "অতএব", "তাই", "তবে", "কিন্তু", "অথচ",
    "তদুপরি", "অধিকন্তু", "বস্তুত", "প্রকৃতপক্ষে", "ফলস্বরূপ",
    "এর ফলে", "অন্যদিকে", "পক্ষান্তরে", "উপরন্তু", "সর্বোপরি",
    "পরিশেষে", "তাছাড়া", "তাছাড়া", "এছাড়া", "এছাড়া",
    "বস্তুতপক্ষে", "এমতাবস্থায়", "এমতাবস্থায়",
]

[conjunctions]
clause_conjunctions = [
    # সংযোজক ও বিয়োজক অব্যয়
    "এবং", "ও", "আর", "কিন্তু", "তবে", "অথচ", "বরং", "নতুবা", "কিংবা", "অথবা", "বা",
    # কারণ ও ফলাফলবাচক অব্যয়
    "কারণ", "যেহেতু", "সেহেতু", "কেননা", "তাই", "জন্য", "সুতরাং",
    # শর্ত ও বৈপরীত্যবাচক অব্যয়
    "যদি", "যদিও", "তবুও", "তথাপি", "তবু",
    # কাল ও উদ্দেশ্যবাচক অব্যয়
    "যাতে", "যেন", "যতক্ষণ", "ততক্ষণ", "যখন", "তখন", "যেমন", "তেমন",
    # সাপেক্ষ সর্বনাম ও সংযোজক
    "যে", "যিনি", "যাঁরা", "যারা", "যা", "যাহা",
]

[abbreviations]
nonbreaking_prefixes = [
    # পদবি ও সম্মানসূচক শব্দসংক্ষেপ
    "ড.", "ডা.", "প্রা.", "প্রফ.", "প্রফেসর.", "শ্রী", "শ্রীমতী", "জনাব.", "বেগম.",
    "মুহ.", "মোঃ", "মো.", "মাও.", "মৌ.", "মুফতী.", "সৈয়দ.", "শেখ.",
    "এড.", "ব্যারিস্টার.", "লে.", "কর্নেল.", "মেজর.", "ক্যাপ্টেন.", "ব্রিগে.",
    "পণ্ডিত.", "ঠাকুর.",
    # প্রাতিষ্ঠানিক, গ্রন্থপঞ্জি ও সাধারণ সংক্ষেপ
    "উদা.", "উদাহ.", "পৃ.", "পৃষ্ঠা.", "দ্র.", "দ্রষ্টব্য.", "নং", "নম্বর.",
    "তাং", "তারিখ.", "লিঃ", "প্রাঃ", "কোং", "বিঃ দ্রঃ", "বি.দ্র.",
    "মোং", "খং", "গং", "সাং", "পোঃ", "পো.অ.", "জিলা.", "জেলা.",
]
conditional_end_prefixes = [
    "ইত্যাদি.", "প্রভৃতি.", "প্রমুখ.", "বিঃ দ্রঃ", "বি.দ্র.", "উদা.", "দ্র.", "নং", "পৃ.",
]
