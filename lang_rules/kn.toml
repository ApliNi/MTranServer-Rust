[metadata]
language = "kn"
version = "1.0.0"
word_boundary = true

[generation]
token_density_ratio = 1.25
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
quote_style = "curly"

[syntax]
clustering_gap_threshold = 4
head_direction = "head_final"

[discourse]
discourse_starters = [
    # ಪುರುಷವಾಚಕ ಮತ್ತು ನಿರ್ದೇಶಕ ಸರ್ವನಾಮಗಳು
    "ಅವನು", "ಅವಳು", "ಅವರು", "ಅದು", "ಅವು",
    "ಅವನ", "ಅವಳ", "ಅವರ", "ಅದರ", "ಅವುಗಳ", "ಅವನಿಗೆ", "ಅವಳಿಗೆ", "ಅವರಿಗೆ", "ಅದಕ್ಕೆ",
    "ಇವನು", "ಇವಳು", "ಇವರು", "ಇದು", "ಇವು",
    "ಇವನ", "ಇವಳ", "ಇವರ", "ಇದರ", "ಇವುಗಳ", "ಇವನಿಗೆ", "ಇವಳಿಗೆ", "ಇವರಿಗೆ", "ಇದಕ್ಕೆ",
    # ವಾಕ್ಯಾರಂಭದ ಸಂಯೋಜಕಗಳು ಮತ್ತು ಕ್ರಿಯಾವಿಶೇಷಣಗಳು
    "ಆದ್ದರಿಂದ", "ಹೀಗಾಗಿ", "ಆದಾಗ್ಯೂ", "ಆದರೂ", "ಪರಿಣಾಮವಾಗಿ", "ವಾಸ್ತವವಾಗಿ",
    "ಮೇಲಾಗಿ", "ಇದಲ್ಲದೆ", "ಅಷ್ಟೇ ಅಲ್ಲದೆ", "ಅಂತಿಮವಾಗಿ", "ಕೊನೆಗೆ", "ಹೀಗೆ",
    "ಮತ್ತೊಂದೆಡೆ", "ಅದೇ ರೀತಿ", "ವಿಶೇಷವಾಗಿ", "ಸಂಕ್ಷೇಪವಾಗಿ",
]

[conjunctions]
clause_conjunctions = [
    # ಸಮುಚ್ಚಯ ಮತ್ತು ವಿಕಲ್ಪಾವ್ಯಯಗಳು
    "ಮತ್ತು", "ಹಾಗೂ", "ಆದರೆ", "ಆದರೂ", "ಅಥವಾ", "ಇಲ್ಲವೇ",
    # ಕಾರಣ ಮತ್ತು ಪರಿಣಾಮವಾಚಕಗಳು
    "ಏಕೆಂದರೆ", "ಯಾಕೆಂದರೆ", "ಆದ್ದರಿಂದ", "ಅದಕ್ಕಾಗಿ", "ಹಾಗಾಗಿ", "ಆದ ಪ್ರಯುಕ್ತ", "ಆದ ಕಾರಣ",
    # ಷರತ್ತು, ಕಾಲ ಮತ್ತು ರೀತಿವಾಚಕಗಳು
    "ಒಂದು ವೇಳೆ", "ಆಗ", "ಯಾವಾಗ", "ಹೇಗೆ", "ಹಾಗೆ",
    "ಎಲ್ಲಿ", "ಅಲ್ಲಿ", "ಎಲ್ಲಿಯವರೆಗೆ", "ಅಲ್ಲಿಯವರೆಗೆ",
    # ಅನುಕರಣ ಮತ್ತು ನಿರೂಪಣಾವ್ಯಯಗಳು
    "ಎಂಬುದು", "ಎಂದು",
]

[abbreviations]
nonbreaking_prefixes = [
    # ಗೌರವಾರ್ಥ ಮತ್ತು ವೃತ್ತಿಪದವಿ ಸಂಕ್ಷಿಪ್ತ ರೂಪಗಳು
    "ಡಾ.", "ಪ್ರೊ.", "ಶ್ರೀ", "ಶ್ರೀಮತಿ", "ಕು.", "ಪಂ.", "ಸ್ವಾಮಿ.", "ನ್ಯಾಯಾ.",
