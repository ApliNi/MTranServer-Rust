    # ಉಲ್ಲೇಖ, ಪತ್ರ ಮತ್ತು ಸಾಮಾನ್ಯ ಸಂಕ್ಷೇಪಗಳು
    "ಉದಾ.", "ಪು.", "ಪುಟ.", "ಸಂ.", "ಸಂಖ್ಯೆ.", "ಕ್ರ.", "ದಿನಾಂಕ.", "ದಿ.",
    "ಲಿ.", "ಲಿಮಿಟೆಡ್.", "ಸಾ.", "ವಿ.ಸೂ.", "ಪೂ.ಪ.", "ಇ.ಪೂ.", "ಇ.ಸ.",
]
conditional_end_prefixes = [
    "ಇತ್ಯಾದಿ.", "ಇ.", "ಉದಾ.", "ಪು.", "ಸಂ.", "ದಿನಾಂಕ.", "ಕ್ರ.",
]
