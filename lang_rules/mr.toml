[metadata]
language = "mr"
version = "1.0.0"
word_boundary = true

[generation]
token_density_ratio = 1.20
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
quote_style = "curly"

[syntax]
clustering_gap_threshold = 4
head_direction = "head_final"

[discourse]
discourse_starters = [
    # तृतीयपुरुषी व दर्शक सर्वनामे
    "तो", "ती", "ते", "त्या", "त्याने", "तिने", "त्यांनी", "त्याला", "तिला", "त्यांना",
    "त्याचा", "त्याची", "त्याचे", "त्यांचे", "त्यांची",
    "हा", "ही", "हे", "ह्या", "यांनी", "याने", "हिने", "याला", "हिला", "यांना",
    "याचा", "याची", "याचे", "यांचे", "यांची",
    # परिच्छेद व वाक्यसंयोजक उभयान्वयी अव्यये
    "म्हणून", "त्यामुळे", "परिणामी", "तथापि", "तरीही", "वस्तुतः", "खरोखर",
    "शिवाय", "याशिवाय", "अधिक म्हणजे", "शेवटी", "अंतिमतः", "उलटपक्षी",
    "दुसऱ्या बाजूला", "तसेच", "याउलट", "थोडक्यात", "विशेषतः",
]

[conjunctions]
clause_conjunctions = [
    # समुच्चयबोधक व विकल्पबोधक उभयान्वयी अव्यये
    "आणि", "व", "अन", "पण", "परंतु", "मात्र", "किंवा", "अथवा", "की",
    # कारणबोधक व परिणामबोधक अव्यये
    "कारण", "कारण की", "म्हणून", "यासाठी", "कारणस्तव",
    # संकेतबोधक, कालवाचक व रीतिवाचक अव्यये
    "जर", "तर", "जरी", "तरी", "जेव्हा", "तेव्हा", "जसे", "तसे",
    "जिथे", "तिथे", "ज्याअर्थी", "त्याअर्थी", "म्हणजे",
]

[abbreviations]
nonbreaking_prefixes = [
    # पदव्या, सन्मानदर्शक व आदरार्थी संक्षेप
    "डॉ.", "प्रा.", "प्रो.", "श्री.", "श्रीमती.", "कु.", "सौ.", "पं.",
    "न्या.", "ॲड.", "कै.", "स्व.", "महा.", "मु.", "कर्नल.", "मेजर.",
    # संदर्भ, कार्यालयीन व व्यावहारिक संक्षेप
    "उदा.", "पृ.", "पान.", "क्र.", "दि.", "दिनांक.", "ता.", "तारीख.",
    "इ.", "वि.वि.", "लि.", "प्रा.लि.", "सां.", "मु.पो.", "पो.",
]
conditional_end_prefixes = [
    "इत्यादी.", "इ.", "उदा.", "पृ.", "क्र.", "दि.", "ता.", "लि.",
]

[detection]
unique_chars = ['ळ']
substring_terms = ["महाराष्ट्र", "पुणे", "तील"]
whole_words = ["हे", "आहे", "आणि"]
