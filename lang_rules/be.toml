[metadata]
language = "be"
version = "1.0.0"
word_boundary = true

[generation]
token_density_ratio = 1.25
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
quote_style = "guillemets"

[syntax]
clustering_gap_threshold = 3
head_direction = "head_initial"

[discourse]
discourse_starters = [
    # Third-person anaphoric pronouns and oblique forms
    "ён", "Ён", "яна", "Яна", "яно", "Яно", "яны", "Яны",
    "яго", "Яго", "яе", "Яе", "іх", "Іх", "яму", "Яму", "ёй", "Ёй", "ім", "Ім",
    "імі", "Імі", "ягоны", "Ягоны", "яечны", "Яечны", "іхні", "Іхні",
    # Demonstratives
    "гэта", "Гэта", "гэты", "Гэты", "гэтая", "Гэтая", "гэтае", "Гэтае", "гэтыя", "Гэтыя",
    "гэтага", "Гэтага", "гэтым", "Гэтым",
    "той", "Той", "тая", "Тая", "тое", "Тое", "тыя", "Тыя", "таго", "Таго", "тым", "Тым",
    "такі", "Такі", "такая", "Такая", "такое", "Такое", "такія", "Такія",
    "тут", "Тут", "там", "Там",
    # Discourse connectives and transitions
    "акрамя таго", "Акрамя таго", "больш за тое", "Больш за тое", "аднак", "Аднак",
    "тым не менш", "Тым не менш", "такім чынам", "Таким чынам", "нарэшце", "Нарэшце",
    "зрэшты", "Зрэшты", "сапраўды", "Сапраўды", "насамрэч", "Насамрэч",
    "між іншым", "Між іншым", "напрыклад", "Напрыклад", "таму", "Таму",
    "адпаведна", "Адпаведна", "у выніку", "У выніку", "па-першае", "Па-першае",
    "па-другое", "Па-другое", "з іншага боку", "З іншага боку", "відавочна", "Відавочна",
]

[conjunctions]
clause_conjunctions = [
    # Coordinating conjunctions
    "і", "ды", "а", "але", "аднак", "затое", "ці", "або", "альбо",
    # Subordinating conjunctions - causal, consecutive, and final
    "бо", "таму што", "праз тое што", "дзякуючы таму што", "паколькі", "так што",
    "каб", "абы", "для таго каб",
    # Subordinating conjunctions - concessive and conditional
    "хоць", "хоця", "нягледзячы на тое што", "дарма што",
    "калі", "калі б", "як",
    # Subordinating conjunctions - temporal
    "як толькі", "пакуль", "перш чым", "пасля таго як", "ледзь",
    # Comparative and modal
    "быццам", "нібы", "нібыта", "бы", "як бы",
    # Relative pronouns and locatives
    "што", "дзе", "куды", "адкуль", "які", "якая", "якое", "якія", "каторы", "хто",
]

[abbreviations]
nonbreaking_prefixes = [
    # Titles and honorifics
    "акад.", "дац.", "д-р.", "канд.", "кап.", "майор.", "праф.", "св.",
    "сп.", "сп-ня.",
    # Scholarly, textual, and editorial
    "выд.", "вып.", "г. зн.", "гл.", "і г. д.", "і інш.", "і т. п.", "іл.",
    "ім.", "інш.", "мал.", "напр.", "параўн.", "разд.", "рэд.", "с.",
    "стар.", "сш.", "табл.",
    # Administrative, geographical, and address
    "в.", "вёс.", "вобл.", "вул.", "г.", "гар.", "д.", "зав.", "кв.",
    "пас.", "пл.", "пр.", "р-н.",
    # Time, metrics, currency, and quantities
    "гадз.", "гг.", "да н. э.", "кап.", "млн.", "млрд.", "н. э.", "руб.",
    "сек.", "ст.", "стст.", "тыс.", "хв.",
    # International Latin abbreviations
    "Dr.", "Fig.", "Prof.", "e.g.", "et al.", "etc.", "i.e.", "vs.",
]
conditional_end_prefixes = [
    "і г. д.", "і т. п.", "і інш.", "г. зн.", "руб.", "кап.", "гг.", "г.",
    "ст.", "н. э.", "до н. э.", "etc.",
]

[detection]
unique_chars = ['ў', 'Ў']
distinctive_chars = ['і', 'І']
exclude_chars = ['ї', 'є', 'ґ', 'Ї', 'Є', 'Ґ']
substring_terms = ["Белару", "сёння", "дзень", "гэты", "дзякуй"]
