[metadata]
language = "te"
version = "1.0.0"
word_boundary = true

[generation]
token_density_ratio = 1.25
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
quote_style = "curly"

[syntax]
clustering_gap_threshold = 4
head_direction = "head_final"

[discourse]
discourse_starters = [
    # ప్రథమ పురుష మరియు నిర్దేశక సర్వనామాలు
    "అతను", "ఆమె", "వారు", "అది", "అవి",
    "అతని", "ఆమె యొక్క", "వారి", "దాని", "వాటి",
    "అతనికి", "ఆమెకు", "వారికి", "దానికి", "వాటికి",
    "ఇతను", "ఈమె", "వీరు", "ఇది", "ఇవి",
    "ఇతని", "ఈమె యొక్క", "వీరి", "దీని", "వీటికి",
    "ఇతనికి", "ఈమెకు", "వీరికి", "దీనికి", "వీటికి",
    # వ్యావహారిక సంయోజకాలు మరియు క్రియావిశేషణాలు
    "కాబట్టి", "అందువల్ల", "అయినప్పటికీ", "ఫలితంగా", "వాస్తవానికి", "నిజానికి",
    "పైగా", "అంతేకాక", "అదనంగా", "చివరగా", "ముగింపుగా", "మరోవైపు",
    "అలా కాకుండా", "ముఖ్యంగా", "సంక్షిప్తంగా", "అదే సమయంలో",
]

[conjunctions]
clause_conjunctions = [
    # సముచ్ఛయ మరియు వికల్ప సంయోజకాలు
    "మరియు", "కానీ", "అయితే", "లేదా", "కాకపోతే",
    # కారణ మరియు పరిణామబోధక అవ్యయాలు
    "ఎందుకంటే", "అందువలన", "కావున", "కాబట్టి",
    # నిబంధన, కాల మరియు రీతివాచకాలు
    "ఒకవేళ", "అయిననూ", "ఎప్పుడు", "అప్పుడు", "ఎలా", "అలా",
    "ఎక్కడ", "అక్కడ", "అయినప్పటికీ", "ఎంతవరకు",
    # అనుకరణ మరియు కథన సంయోజకాలు
    "అని", "అంటూ",
]

[abbreviations]
nonbreaking_prefixes = [
    # గౌరవ మరియు వృత్తిపరమైన బిరుదులు
    "డా.", "ప్రొ.", "శ్రీ", "శ్రీమతి", "చి.", "కు.", "పం.",
    "న్యాయ.", "ఇంజ.", "స్వామి.", "కీ.శే.", "మేజర్.", "కెప్టెన్.",
    # గ్రంథసూచి, లేఖన మరియు సాధారణ సంక్షిప్తాలు
    "ఉదా.", "పేజీ.", "సం.", "సంఖ్య.", "నం.", "తేది.",
    "లిమిటెడ్.", "వి.వి.", "పూ.భా.", "ఉ.భా.", "ది.",
]
conditional_end_prefixes = [
    "మొదలైనవి.", "ఇత్యాది.", "ఉదా.", "పేజీ.", "నం.", "తేది.",
]
