[package]
name = "mtranserver-test"
version = "0.1.0"
edition = "2021"

[lib]
name = "mtranserver_test"
path = "src/lib.rs"

[[bin]]
name = "regression"
path = "src/bin/regression.rs"

[dependencies]
mtranserver_lib = { package = "MTranServer-Rust", path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "fs",
] }
clap = { version = "4", features = ["derive", "env"] }
