[metadata]
language = "en"
version = "1.0.0"
word_boundary = true

[abbreviations]
nonbreaking_prefixes = ["Mr.", "e.g.", "i.e."]

[conjunctions]
clause_conjunctions = ["and", "but", "even though", "though"]

[discourse]
discourse_starters = ["it", "this", "they"]

[hyphenation]
prefixes = ["pre", "post", "non", "multi", "auto", "sub"]
suffixes = ["free", "based", "driven", "friendly"]
connectors = ["to", "of", "and"]

[syntax]
clustering_gap_threshold = 3
head_direction = "head_initial"
