[metadata]
language = "es"
version = "1.0.0"
word_boundary = true

[generation]
token_density_ratio = 1.15
repetition_penalty = 1.15
no_repeat_ngram_size = 3

[typography]
spanish_inverted = true
quote_style = "curly"

[syntax]
clustering_gap_threshold = 3
head_direction = "head_initial"
[abbreviations]
nonbreaking_prefixes = ["Dr.", "Dra.", "Prof.", "Sr.", "Sra.", "p. ej."]
conditional_end_prefixes = ["etc.", "al.", "núm.", "pág."]

[conjunctions]
clause_conjunctions = ["pero", "aunque", "porque", "sin embargo", "por lo tanto"]

[discourse]
discourse_starters = ["él", "ella", "ellos", "este", "esta", "estos", "además"]
